# Tự build APK trên GitHub (không cần cài Android Studio):
# đẩy thư mục này lên một repo GitHub -> tab Actions -> "Build APK" -> tải file LuckyTide-apk ở mục Artifacts.
name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Default server address shown on first launch (optional)"
        required: false
        default: "https://"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest đã có sẵn Android SDK (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease -PserverUrl="${{ github.event.inputs.server_url || 'https://' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTide-apk
          path: app/build/outputs/apk/release/*.apk
      # Đăng APK lên mục Releases (tải thẳng bằng điện thoại) + nhánh apk-build
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LuckyTide.apk
          gh release create "build-${{ github.run_number }}" LuckyTide.apk --title "Lucky Tide APK #${{ github.run_number }}" --notes "Download LuckyTide.apk on your Android phone and install it." --latest
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan apk-build
          git rm -rq --cached .
          git add -f LuckyTide.apk
          git commit -qm "APK build ${{ github.run_number }}"
          git push -f origin apk-build
